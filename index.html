<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/oxygen-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxygen Metrics</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/Main.res.mjs"></script>
  <script>
    // Standalone page: mount the dashboard into #root through the same global
    // embedded deployments use (see src/Main.res).
    (function () {
      function start() {
        window.OxygenMetrics({ domId: "root" });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
  </script>
</body>

</html>
